name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que l'application est bien là
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::Le fichier www/index.html (l'application MotoRoute) manque dans le dépôt."
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Fabriquer l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MotoRoute-test-${{ github.run_number }}.apk

      - name: Garder l'APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MotoRoute-test-${{ github.run_number }}
          path: MotoRoute-test-${{ github.run_number }}.apk

      - name: Publier l'APK à télécharger (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: MotoRoute – version de test ${{ github.run_number }}
          prerelease: true
          files: MotoRoute-test-${{ github.run_number }}.apk
