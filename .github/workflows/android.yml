name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier que l'application est bien là
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::Le fichier www/index.html (l'application MotoRoute) manque dans le dépôt."
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx capacitor-assets generate --android --iconBackgroundColor '#101316' --iconBackgroundColorDark '#101316' --splashBackgroundColor '#101316' --splashBackgroundColorDark '#101316'
          npx cap sync android

      - name: Fabriquer l'appli (version signée si la clé MotoRoute est dans les secrets)
        working-directory: android
        env:
          MR_KEYSTORE: ${{ secrets.MR_KEYSTORE }}
          MR_KEY_PASS: ${{ secrets.MR_KEY_PASS }}
          RUN: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          OUT=../MotoRoute-test-$RUN.apk
          # MR_KEYSTORE peut contenir soit le texte de la clé, soit tout le fichier motoroute-cle-secrets.txt
          if printf '%s' "$MR_KEYSTORE" | grep -q "=== Secret 2"; then
            P1=$(printf '%s\n' "$MR_KEYSTORE" | awk '/=== Secret 1/{getline; print; exit}' | tr -d '[:space:]')
            KS=$(printf '%s\n' "$MR_KEYSTORE" | awk '/=== Secret 2/{f=1;next} f&&/^[[:space:]]*$/{exit} f' | tr -d '[:space:]')
            [ -z "$MR_KEY_PASS" ] && MR_KEY_PASS="$P1"
          else
            KS=$(printf '%s' "$MR_KEYSTORE" | tr -d '[:space:]')
          fi
          MR_KEY_PASS=$(printf '%s' "$MR_KEY_PASS" | tr -d '[:space:]')
          export MR_KEY_PASS
          if [ -z "$KS" ] || [ -z "$MR_KEY_PASS" ]; then
            echo "::warning::Clé MotoRoute absente des secrets : APK de test non signée (debug)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
            exit 0
          fi
          printf '%s' "$KS" | base64 -d > ../mr.keystore
          keytool -list -keystore ../mr.keystore -storepass "$MR_KEY_PASS" -alias motoroute >/dev/null || { echo "::error::Clé ou mot de passe MotoRoute incorrect dans les secrets."; exit 1; }
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
          "$BT/apksigner" sign --ks ../mr.keystore --ks-key-alias motoroute --ks-pass env:MR_KEY_PASS --key-pass env:MR_KEY_PASS --out "$OUT" ../aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          cp app/build/outputs/bundle/release/app-release.aab ../MotoRoute-$RUN.aab
          jarsigner -keystore ../mr.keystore -storepass "$MR_KEY_PASS" -keypass "$MR_KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 ../MotoRoute-$RUN.aab motoroute
          jarsigner -verify ../MotoRoute-$RUN.aab | tail -1
          rm -f ../mr.keystore ../aligned.apk

      - name: Garder les fichiers (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: MotoRoute-${{ github.run_number }}
          path: |
            MotoRoute-test-${{ github.run_number }}.apk
            MotoRoute-${{ github.run_number }}.aab
          if-no-files-found: ignore

      - name: Publier l'APK à télécharger (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: MotoRoute – version de test ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            MotoRoute-test-${{ github.run_number }}.apk
            MotoRoute-${{ github.run_number }}.aab
