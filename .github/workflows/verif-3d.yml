name: Vérifier le replay 3D (captures)
on:
  push:
    branches: [verif-3d]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lancer les captures
        run: |
          mkdir -p /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i puppeteer-core@23 --no-audit --no-fund >/dev/null
          cd $GITHUB_WORKSPACE/www && (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2
          cp $GITHUB_WORKSPACE/scripts/verif-3d.js $GITHUB_WORKSPACE/scripts/simulation-elaid.js /tmp/t/ && cd /tmp/t && node verif-3d.js && node simulation-elaid.js
      - name: Ranger les captures dans la branche
        if: always()
        run: |
          rm -rf verif && mkdir -p verif && cp -r /tmp/t/out/. verif/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add verif && git commit -m "Captures replay 3D [skip ci]" && git push || true
