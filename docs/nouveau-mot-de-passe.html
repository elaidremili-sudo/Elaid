<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotoRoute – Nouveau mot de passe</title>
<style>
:root{--bg:#101316;--card:#1b2026;--ink:#eef0f2;--mute:#a9b2bb;--acc:#ffd33d;--line:#2c333a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:32px 16px 60px}
img{width:72px;height:72px;border-radius:16px;display:block;margin-bottom:12px}
h1{font-size:26px;margin:0 0 6px}
.m{color:var(--mute);font-size:14px}
section{background:var(--card);border-radius:14px;padding:18px;margin-top:18px}
label{display:block;font-weight:600;margin:12px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c0e10;color:var(--ink);font-size:16px}
button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:99px;background:var(--acc);color:#1b1f24;font-weight:700;font-size:16px}
button:disabled{opacity:.6}
.msg{margin-top:14px}
.ok{color:#4ade80}.err{color:#f87171}
[dir=rtl]{text-align:right}
</style>
</head>
<body>
<main>
<img src="icon.png" alt="">
<h1 id="t">Nouveau mot de passe</h1>
<div class="m" id="s">Choisis un nouveau mot de passe pour ton compte MotoRoute.</div>
<section id="box">
  <div class="m" id="wait">Vérification du lien…</div>
  <form id="f" hidden>
    <label for="p1" id="l1">Nouveau mot de passe (6 caractères min.)</label>
    <input id="p1" type="password" autocomplete="new-password" minlength="6" required>
    <label for="p2" id="l2">Confirme le mot de passe</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="6" required>
    <button id="b" type="submit">Enregistrer</button>
  </form>
  <div class="msg" id="msg"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const U='https://ixtqlxltwuktpdznbhnx.supabase.co',K='sb_publishable_PKw5lXyvnQCgUT_5S1r__w_HW2gbW-K';
const L=(navigator.language||'fr').slice(0,2);
const T={
 fr:{t:'Nouveau mot de passe',s:'Choisis un nouveau mot de passe pour ton compte MotoRoute.',w:'Vérification du lien…',l1:'Nouveau mot de passe (6 caractères min.)',l2:'Confirme le mot de passe',b:'Enregistrer',
     bad:'Ce lien a expiré ou a déjà servi. Dans l’application, touche 🔑 puis « Mot de passe oublié ? » pour en recevoir un nouveau.',
     diff:'Les deux mots de passe ne sont pas identiques.',short:'6 caractères minimum.',ok:'Mot de passe changé ✓ Retourne dans l’application MotoRoute et connecte-toi avec ton nouveau mot de passe.'},
 ar:{t:'كلمة مرور جديدة',s:'اختر كلمة مرور جديدة لحسابك في MotoRoute.',w:'جارٍ التحقق من الرابط…',l1:'كلمة المرور الجديدة (6 أحرف على الأقل)',l2:'أكّد كلمة المرور',b:'حفظ',
     bad:'انتهت صلاحية هذا الرابط أو استُعمل من قبل. في التطبيق اضغط 🔑 ثم «نسيت كلمة المرور؟» لتلقي رابط جديد.',
     diff:'كلمتا المرور غير متطابقتين.',short:'6 أحرف على الأقل.',ok:'تم تغيير كلمة المرور ✓ ارجع إلى تطبيق MotoRoute وسجّل الدخول بكلمة المرور الجديدة.'},
 en:{t:'New password',s:'Choose a new password for your MotoRoute account.',w:'Checking the link…',l1:'New password (min. 6 characters)',l2:'Confirm the password',b:'Save',
     bad:'This link has expired or was already used. In the app, tap 🔑 then “Forgot password?” to get a new one.',
     diff:'The two passwords do not match.',short:'At least 6 characters.',ok:'Password changed ✓ Go back to the MotoRoute app and log in with your new password.'}};
const x=T[L]||T.fr,$=id=>document.getElementById(id);
if(L==='ar')document.querySelector('main').setAttribute('dir','rtl');
$('t').textContent=x.t;$('s').textContent=x.s;$('wait').textContent=x.w;$('l1').textContent=x.l1;$('l2').textContent=x.l2;$('b').textContent=x.b;
const say=(t,c)=>{$('msg').textContent=t;$('msg').className='msg '+(c||'')};
const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);
const linkErr=h.get('error_description')||q.get('error_description');
let sb=null;try{sb=window.supabase.createClient(U,K,{auth:{detectSessionInUrl:true,persistSession:false}})}catch(e){}
let ready=false;
const show=()=>{if(ready)return;ready=true;$('wait').hidden=true;$('f').hidden=false;$('p1').focus()};
const fail=()=>{if(ready)return;$('wait').hidden=true;say(x.bad,'err')};
if(!sb||linkErr){fail();return}
sb.auth.onAuthStateChange((ev,s)=>{if(s&&(ev==='PASSWORD_RECOVERY'||ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))show()});
(async()=>{
 try{const code=q.get('code');if(code){const r=await sb.auth.exchangeCodeForSession(code);if(r.error)return fail()}}catch(e){}
 const r=await sb.auth.getSession();if(r.data&&r.data.session)show();
 setTimeout(()=>{if(!ready)fail()},6000);
})();
$('f').addEventListener('submit',async e=>{
 e.preventDefault();const a=$('p1').value,b=$('p2').value;
 if(a.length<6)return say(x.short,'err');if(a!==b)return say(x.diff,'err');
 $('b').disabled=true;const r=await sb.auth.updateUser({password:a});$('b').disabled=false;
 if(r.error)return say(r.error.message,'err');
 $('f').hidden=true;say(x.ok,'ok');try{await sb.auth.signOut({scope:'local'})}catch(e){}
});
})();
</script>
</body>
</html>
