<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>MotoRoute – Sorties et annonces</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef0;--card:#fff;--ink:#1b1f24;--mute:#5d6670;--line:#d5d9de;--acc:#f2b705;--on-acc:#1b1f24;--ok:#0f766e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1f2428;--ink:#eef0f2;--mute:#9aa4ae;--line:#323a41;--ok:#3cc4b6}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1f2428;--ink:#eef0f2;--mute:#9aa4ae;--line:#323a41;--ok:#3cc4b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
h1{font:700 32px 'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.5px}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding:10px 16px;max-width:640px;margin:0 auto}
nav button{flex:1;padding:12px;border:2px solid var(--ink);background:none;color:var(--ink);font:600 16px Barlow,sans-serif;border-radius:10px}
nav button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
main{max-width:640px;margin:0 auto;padding:6px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font:700 22px 'Barlow Condensed',sans-serif}
.meta{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.price{font:700 22px 'Barlow Condensed',sans-serif}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;border:1.5px solid var(--ink);margin-right:6px}
.tag.v{background:var(--ok);border-color:var(--ok);color:#fff}
.tag.a{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
button.p{background:var(--acc);color:var(--on-acc);border:0;border-radius:10px;padding:10px 14px;font:600 15px Barlow,sans-serif}
button.p.done{background:var(--ok);color:#fff}
button.g{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 12px;font:500 14px Barlow,sans-serif}
button.g.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:14px 20px;font:600 16px Barlow,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3)}
dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font:16px Barlow,sans-serif;background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{position:relative;height:280px;overflow:hidden;background:#2a3a4a}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,15,25,.7),rgba(10,15,25,0) 55%)}
.hero header{position:relative;padding-top:64px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.hero h1{color:#fff;font-size:36px}
.hero p{color:#f4f4f4}

.hero{height:auto;background:none}
nav{background:rgba(20,23,26,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
nav button{color:#fff;border-color:#fff}
.filters .g{background:var(--card)}
.empty{background:var(--card);color:var(--ink);border-radius:12px}
.dt{margin:0;font:700 24px 'Barlow Condensed',sans-serif}
.tag{margin-right:0;margin-inline-end:6px}
.lang{position:absolute;top:14px;inset-inline-end:14px;z-index:3;display:flex;align-items:center;gap:6px;background:rgba(10,15,25,.55);color:#fff;border:1.5px solid rgba(255,255,255,.8);border-radius:99px;padding:7px 12px;font:600 14px Barlow,sans-serif;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
[dir=rtl] .fab{right:auto;left:16px}
[dir=rtl] *{font-family:Cairo,system-ui,sans-serif !important}
[dir=rtl] .hero h1{font-family:'Barlow Condensed',Impact,sans-serif !important}
dialog{max-height:90vh;overflow:auto}
.ph{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-bottom:10px;display:block}
.prev{width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-top:8px;display:block}
.prev[hidden]{display:none}
input[type=file]{padding:8px}
.pp-clean{background:var(--ok);border-color:var(--ok);color:#fff}
.pp-issue{background:#c2410c;border-color:#c2410c;color:#fff}
.pp-none{background:#b91c1c;border-color:#b91c1c;color:#fff}
nav button{font-size:15px;padding:12px 4px}
input[type=checkbox]{width:auto}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:500}
.lnk{text-decoration:none;display:inline-block;background:var(--acc);color:var(--on-acc);border-radius:10px;padding:10px 14px;font:600 15px Barlow,sans-serif}
button.p.sosb{background:#c1121f;color:#fff;font-size:18px;padding:14px 20px;width:100%}
.partner{border:2px solid var(--acc)}
.tools{position:absolute;top:14px;inset-inline-end:14px;z-index:3;display:flex;flex-wrap:nowrap;justify-content:flex-end;gap:5px;max-width:calc(100% - 28px)}.tools .lang{padding:6px 9px;font-size:13px}
.tools .lang{position:static}
.hb{width:34px;justify-content:center;padding:6px 0!important;font-size:16px!important;font-weight:700}
.hp{margin:12px 0}.hp b{display:block}.hp span{color:var(--mute)}
.srch{margin-bottom:10px}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;max-width:none;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;background:rgba(18,21,25,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.12);z-index:20}

const fd=d=>{try{return new Date(d+'T12:00').toLocaleDateString(T().loc,{weekday:'long',day:'numeric',month:'long'})}catch(e){return d}};

function statics(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T()[e.dataset.i]);
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T()[e.dataset.ph]);
 $('lang').querySelector('span').textContent=T().other;
}
const mapUrl=s=>s.map||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.dep||''));
const waOk=u=>/^https:\/\/(chat\.whatsapp\.com|wa\.me)\//i.test(u);
function addWa(id){const u=(prompt(T().g_wa,'')||'').trim();if(!u)return;if(!waOk(u)){alert(T().err6);return}S.groups.find(g=>g.id==id).wa=u}
const gname=id=>(S.groups.find(g=>g.id==id)||{}).name;
const vids={};
function fillG(){$('s_g').innerHTML=`<option value="">${T().none_g}</option>`+S.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}
function groupsView(t){
 if(!gid){return S.groups.length?S.groups.map(g=>`<div class="card"><h3>${esc(g.name)}</h3><div class="meta">${esc(g.city||'')} · ${g.mem+(g.me?1:0)} ${t.members}</div><div class="row"><button class="g" data-go="${g.id}">${t.memories} (${S.mems.filter(m=>m.g==g.id).length})</button><button class="p ${g.me?'done':''}" data-mj="${g.id}">${g.me?t.member:t.join_g}</button></div>${g.wa?`<div class="row" style="justify-content:flex-start"><a class="lnk" target="_blank" rel="noopener" href="${esc(g.wa)}">${t.join_wa}</a></div>`:''}</div>`).join(''):`<div class="empty">${t.no_grp}</div>`}
 const g=S.groups.find(x=>x.id==gid);if(!g){gid=null;return groupsView(t)}
 const ms=S.mems.filter(m=>m.g==gid),tr=S.sorties.filter(s=>s.g==gid);
 return `<div class="filters"><button class="g" data-back="1">${t.back}</button></div><div class="card"><h3>${esc(g.name)}</h3><div class="meta">${esc(g.city||'')}</div><div class="row" style="justify-content:flex-start">${g.wa?`<a class="lnk" target="_blank" rel="noopener" href="${esc(g.wa)}">${t.join_wa}</a>`:`<button class="g" data-wal="${g.id}">${t.add_wa}</button>`}</div></div>`
 +(tr.length?`<div class="card"><h3>${t.trips}</h3>`+tr.map(s=>`<div class="meta">${fd(s.d)} · ${esc(s.t)}</div>`).join('')+'</div>':'')
 +(ms.length?ms.map(m=>`<div class="card">${m.img?`<img class="ph" src="${esc(m.img)}" alt="">`:vids[m.id]?`<video class="ph" controls playsinline src="${vids[m.id]}"></video>`:m.vid?`<div class="meta">${t.video_lost}</div>`:''}<h3>${esc(m.place)}</h3>${m.cap?`<div class="meta">${esc(m.cap)}</div>`:''}<div class="row"><button class="g" data-md="${m.id}">${t.del}</button></div></div>`).join(''):`<div class="empty">${t.no_mem}</div>`);

function partnersHtml(t){return `<div class="meta" style="color:#fff;font-weight:600;margin:4px 0 8px;text-shadow:0 1px 4px rgba(0,0,0,.6)">${t.partners}</div>`+PARTNERS.map(p=>p.slot?`<div class="card partner"><span class="tag a">${t.ad_label}</span><h3 style="margin-top:8px">${t.slot_name}</h3><div class="meta">${t.slot_txt}</div></div>`:`<div class="card partner"><span class="tag a">${t.ad_label}</span><h3 style="margin-top:8px">${esc(p.name)}</h3><div class="meta">${esc(p.kind||'')} · ${esc(p.city||'')}</div>${p.addr?`<div class="meta">${esc(p.addr)}</div>`:''}<div class="row" style="justify-content:flex-start">${p.phone?`<a class="lnk" href="tel:${esc(p.phone)}">${t.call}</a><a class="lnk" target="_blank" rel="noopener" href="https://wa.me/${esc(p.phone.replace(/\D/g,''))}">${t.wa}</a>`:''}<a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.name||'')+' '+(p.addr||p.city||''))}">${t.route}</a></div></div>`).join('')}
function routeView(t){
 const hz=['gravel','acc','ctrl','wet','hole'];
 return `<div class="card"><h3>${t.r_sos}</h3><input id="r_ph" inputmode="tel" placeholder="${t.sos_phone}" value="${esc(S.sosPhone||'')}"><div class="row"><button class="p sosb" data-sos="1">${t.sos_btn}</button></div><div id="sosOut" class="meta" style="margin-top:8px"></div></div>`
 +`<div class="card"><h3>${t.haz_title}</h3><div class="filters">${hz.map(h=>`<button class="g" data-hz="${h}">${t['h_'+h]}</button>`).join('')}</div>`
 +(S.hz.length?S.hz.slice(0,8).map(x=>`<div class="row" style="margin-top:6px"><span class="meta">${t['h_'+x.k]||''} · ${new Date(x.at).toLocaleTimeString(t.loc,{hour:'2-digit',minute:'2-digit'})}${x.ll?' · '+esc(x.ll):''}</span><button class="g" data-hd="${x.id}">${t.del}</button></div>`).join(''):`<div class="meta">${t.haz_none}</div>`)
 +`<div class="meta" style="margin-top:8px">${t.haz_note}</div></div>`

 +`<div class="card"><h3>${t.notif_title}</h3><label class="chk"><input type="checkbox" id="notif_chk" ${S.notifOn?'checked':''}> ${S.notifOn?t.notif_off:t.notif_on}</label></div>`
 +iceCard(t);

const wxUrl=(p,d)=>'https://www.google.com/search?q='+encodeURIComponent('météo à '+p+(d?(' le '+fd(d)):''));
function dayBadge(s){const n=Math.round((new Date(s.d+'T00:00')-new Date().setHours(0,0,0,0))/864e5);if(isNaN(n)||n<0||n>14)return '';const ar=lang=='ar';const x=n==0?(ar?'اليوم':`Aujourd'hui`):n==1?(ar?'غدًا':'Demain'):(ar?`بعد ${n} أيام`:`Dans ${n} jours`);return `<span class="cd${n>2?' soon':''}">${x}</span>`}
const waShare=(s,t)=>'https://wa.me/?text='+encodeURIComponent('🏍️ '+s.t+'\n📅 '+fd(s.d)+'\n📍 '+s.dep+' → '+s.dest+'\n'+mapUrl(s)+'\n— MotoRoute');
function participantsLine(s,t,all){
 const names=(s.names||[]).slice();
 if(s.joined){const fn=((S.ice&&S.ice.name)||'').trim().split(/\s+/)[0];names.push(fn||t.you||'Vous')}
 const total=s.p+(s.joined?1:0);
 if(!names.length)return `${total} ${t.people}`;
 const cnt=all?names.length:Math.min(4,names.length);
 const rest=total-cnt;
 const av=names.slice(0,cnt).map(n=>`<i class="av" style="background:hsl(${(String(n).charCodeAt(0)*47)%360} 55% 42%)">${esc(String(n)[0]||'?').toUpperCase()}</i>`).join('');
 return `<span class="avs">${av}${rest>0?`<i class="av more">+${rest}</i>`:''}</span>${total} ${t.people}${all?' · '+esc(names.join(', ')):''}`;
}

function notifSupported(){return 'Notification' in window}
function notifStatus(){return notifSupported()?Notification.permission:'unsupported'}
async function toggleNotif(){
 if(!notifSupported()){alert(T().notif_need);return}
 if(Notification.permission==='granted'){S.notifOn=!S.notifOn;save();render();return}
 if(Notification.permission==='denied'){alert(T().notif_denied);return}
 const p=await Notification.requestPermission();
 if(p==='granted'){S.notifOn=true;save();render()}else{alert(T().notif_denied)}
}
function notify(title,body){
 if(!S.notifOn||!notifSupported()||Notification.permission!=='granted')return;
 try{new Notification(title,{body:body,icon:undefined})}catch(e){}
}
function checkUpcoming(){
 if(!S.notifOn)return;
 const now=Date.now(),day=86400000;
 S.sorties.forEach(s=>{
  if(!s.joined)return;
  const t=new Date(s.d+'T12:00').getTime();
  const key='nf_'+s.id;
  if(t-now>0&&t-now<day&&!S['_'+key]){S['_'+key]=true;notify(T().notif_soon_title,T().notif_soon_body.replace('{t}',s.t))}
 });
}
function iceCard(t){
 const i=S.ice;
 if(!i)return `<div class="card"><h3>${t.ice_title}</h3><div class="empty">${t.ice_none}</div><div class="row"><button class="g" data-iceedit="1">${t.ice_edit}</button></div></div>`;
 return `<div class="card"><h3>🆘 ${t.ice_card_title}</h3><div class="meta">${esc(i.name||'')}${i.blood?' · '+esc(i.blood):''}</div>${i.contact?`<div class="meta">${esc(t.ice_contact)}: ${esc(i.contact)}${i.phone?' · '+esc(i.phone):''}</div>`:''}${i.allergy?`<div class="meta">${esc(i.allergy)}</div>`:''}<div class="row" style="justify-content:flex-start;gap:14px;margin-top:6px">${i.phone?`<a class="lnk" href="tel:${esc(i.phone.replace(/\D/g,''))}">${t.ice_call}</a>`:''}<button class="g" data-iceedit="1">${t.ice_edit}</button></div></div>`;
}

function showSortie(id){const s=S.sorties.find(x=>x.id==id);if(!s)return;const t=T();$('sd_h').textContent=s.t;$('sd_b').innerHTML=`<div class="meta">📅 ${fd(s.d)}</div><div class="meta">${t.from} : ${esc(s.dep)}</div><div class="meta">${t.to} : ${esc(s.dest)}</div><div class="meta">${t.km} : ${esc(s.km)} km · ${t[s.n]||esc(s.n)}</div><div class="meta">${participantsLine(s,t,true)}${s.g&&gname(s.g)?' · '+esc(gname(s.g)):''}</div><label>${t.rt_lbl}</label><select id="sd_rt">${['','hw','str','twi','mix','mnt'].map(k=>`<option value="${k}" ${(s.rt||'')==k?'selected':''}>${t['rt_'+(k||'none')]}</option>`).join('')}</select><label>${t.rn_lbl}</label><textarea id="sd_rn" rows="3" placeholder="${t.rn_ph}">${esc(s.rn||'')}</textarea><div class="row" style="justify-content:flex-start;gap:14px;flex-wrap:wrap"><a class="lnk" target="_blank" rel="noopener" href="${esc(mapUrl(s))}">${t.openmap}</a><a class="lnk" target="_blank" rel="noopener" href="${esc('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.dest))}">${t.dest_map}</a><a class="lnk" target="_blank" rel="noopener" href="${esc('https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(s.dep)+'&destination='+encodeURIComponent(s.dest))}">${t.dir_full}</a><a class="lnk" target="_blank" rel="noopener" href="${esc(wxUrl(s.dest,s.d))}">${t.weather_open}</a><a class="lnk" target="_blank" rel="noopener" href="${esc(waShare(s,t))}">💬 ${t.wa}</a></div>`;$('d8').showModal();$('sd_rt').onchange=()=>{s.rt=$('sd_rt').value;save();render()};$('sd_rn').oninput=()=>{s.rn=$('sd_rn').value.trim();save()}}
function totalKm(){return S.log.reduce((a,x)=>a+(Number(x.km)||0),0)}
function badgeFor(n){return n>=10?'badge_vet':n>=3?'badge_conf':'badge_deb'}
function logView(t){
 const km=totalKm(),n=S.log.length,badge=badgeFor(n);
 const sinceV=km-(S.vidKmAt||0),due=sinceV>=S.vidInt;
 const l=[...S.log].sort((a,b)=>a.d<b.d?1:-1);
 return `<div class="card"><h3>${esc(t[badge])}</h3><div class="meta">${t.total_km} : ${km.toLocaleString(t.loc)} km · ${n} ${t.trips_count}</div></div>`
 +`<div class="card"><h3>${t.vid_title}</h3><div class="meta">${due?('⚠️ '+t.vid_due):t.vid_next.replace('{n}',Math.max(0,S.vidInt-sinceV).toLocaleString(t.loc))}</div><div class="row"><button class="g" data-vidset="1">${t.vid_set}</button>${due?`<button class="g" data-vidreset="1">${t.save_v}</button>`:''}</div></div>`
 +(l.length?l.map(x=>`<div class="card"><h3>${fd(x.d)}</h3><div class="meta">${esc(x.dep||'')}${x.dest?' → '+esc(x.dest):''}</div><div class="row"><span class="tag">${(Number(x.km)||0).toLocaleString(t.loc)} km</span><button class="g" data-ld="${x.id}">${t.del}</button></div>${x.dest?`<div class="meta"><a class="lnk" target="_blank" rel="noopener" href="${esc(wxUrl(x.dest,x.d))}">${t.weather_open}</a></div>`:''}</div>`).join(''):`<div class="empty">${t.empty_log}</div>`);
}
function ratingAvg(id){const r=S.ratings[id];if(!r||!r.length)return null;return(r.reduce((a,b)=>a+b,0)/r.length)}

function addHz(k){const x={id:Date.now(),k,at:Date.now(),ll:''};S.hz.unshift(x);save();render();
 try{navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{x.ll=p.coords.latitude.toFixed(4)+', '+p.coords.longitude.toFixed(4);save();if(tab==4)render()},()=>{},{timeout:6000,maximumAge:60000})}catch(e){}}
function doSos(){const t=T(),out=$('sosOut'),ph=($('r_ph').value||'').replace(/[^\d+]/g,'');S.sosPhone=$('r_ph').value;save();
 if(!ph){out.textContent=t.sos_phone;return}
 out.textContent=t.sos_wait;
 const done=ll=>{const msg=t.sos_msg+' '+(ll?t.sos_pos+' https://maps.google.com/?q='+ll:t.sos_nopos);
  out.innerHTML=`<div>${esc(msg)}</div><div class="row"><a class="lnk" href="sms:${ph}?&body=${encodeURIComponent(msg)}">${t.sos_sms}</a><a class="lnk" target="_blank" rel="noopener" href="https://wa.me/${ph.replace(/^\+/,'')}?text=${encodeURIComponent(msg)}">${t.sos_wa}</a></div>`};
 if(!navigator.geolocation){done('');return}
 try{navigator.geolocation.getCurrentPosition(p=>done(p.coords.latitude+','+p.coords.longitude),()=>done(''),{timeout:8000,enableHighAccuracy:true})}catch(e){done('')}}
function motoInfo(a,t){const bits=[a.y,a.k?Number(a.k).toLocaleString(t.loc)+' km':''].filter(Boolean).join(' · ');
 return (bits?`<div class="meta">${esc(bits)}</div>`:'')+(a.pp?`<div class="row" style="justify-content:flex-start"><span class="tag pp-${esc(a.pp)}">${t.pap} : ${t['pp_'+a.pp]||''}</span></div>`:'')+(a.pn?`<div class="meta">${esc(a.pn)}</div>`:'')}
function render(){
 const t=T();
 $('t1').classList.toggle('on',tab==1);$('t2').classList.toggle('on',tab==2);$('t3').classList.toggle('on',tab==3);$('t4').classList.toggle('on',tab==4);$('t5').classList.toggle('on',tab==5);$('t6').classList.toggle('on',tab==6);
 $('fab').textContent=tab==1?t.fab1:tab==2?t.fab2:tab==5?t.add_trip:(gid?t.fab4:t.fab3);$('fab').hidden=tab==4||tab==6;
 const m=$('main');
 if(tab==1){
  const td0=new Date(),td=td0.getFullYear()+'-'+String(td0.getMonth()+1).padStart(2,'0')+'-'+String(td0.getDate()).padStart(2,'0'),all=[...S.sorties].sort((a,b)=>a.d>b.d?1:-1),isP=s=>!!s.d&&s.d<td,nPast=all.filter(isP).length,l=window.mrShowPast?all.filter(isP).reverse():all.filter(s=>!isP(s));
  m.innerHTML=l.length?l.map(s=>`<div class="card"><h3>${esc(s.t)}${dayBadge(s)}</h3>${s.g&&gname(s.g)?`<div><span class="tag">${esc(gname(s.g))}</span></div>`:''}
  <div class="meta">${fd(s.d)}${s.dest?` · <a class="lnk" target="_blank" rel="noopener" href="${esc(wxUrl(s.dest,s.d))}">🌤 ${t.wx_now.replace('{p}',esc(s.dest))}</a>`:''}</div>
  <div class="meta">${esc(s.dep)} → ${esc(s.dest)} · ${esc(s.km)} km</div>
  ${s.dep?`<div class="row" style="justify-content:flex-start;margin-top:8px"><a class="lnk" target="_blank" rel="noopener" href="${esc(mapUrl(s))}">${t.openmap}</a></div>`:''}
  <div class="row" style="justify-content:flex-start;gap:14px;margin-top:8px"><button class="g" data-sd="${s.id}">${t.sd_btn}</button><a class="lnk" target="_blank" rel="noopener" href="${esc(waShare(s,t))}">💬 ${t.wa}</a>${s.rt?`<span class="tag">${t['rt_'+s.rt]}</span>`:''}</div>
  <div class="row"><span><span class="tag">${t[s.n]||esc(s.n)}</span><span class="meta">${participantsLine(s,t)}</span></span>
  <button class="p ${s.joined?'done':''}" data-j="${s.id}">${s.joined?t.joined:t.join}</button></div></div>`).join(''):`<div class="empty">${window.mrShowPast?(lang=='ar'?'لا توجد رحلات سابقة.':lang=='en'?'No past rides.':'Aucune sortie passée.'):t.empty1}</div>`;
  if(nPast||window.mrShowPast)m.innerHTML+=`<div class="row" style="justify-content:center;margin:6px 0 10px"><button class="g" data-past="1">${window.mrShowPast?(lang=='ar'?'→ الرحلات القادمة':lang=='en'?'← Upcoming rides':'← Sorties à venir'):'🕓 '+(lang=='ar'?'الرحلات السابقة':lang=='en'?'Past rides':'Sorties passées')+' ('+nPast+')'}</button></div>`;
 }else if(tab==3){m.innerHTML=groupsView(t)}else if(tab==4){m.innerHTML=routeView(t)}else if(tab==6){m.innerHTML=window.mrRideView?window.mrRideView(t):''}else if(tab==5){m.innerHTML=logView(t)}else{

  const l=S.annonces.filter(a=>(fT=='all'||a.ty==fT)&&(fC=='all'||a.cat==fC)&&!S.rep.includes(a.id)&&(!fF||S.fav.includes(a.id))&&(!q||(a.t+' '+a.de+' '+a.v).toLowerCase().includes(q)));
  m.innerHTML=partnersHtml(t)+`<div class="card"><h3>${t.tips_t}</h3><div class="meta">${t.tips}</div></div><input id="q" type="search" class="srch" placeholder="${t.search}" value="${esc(q)}"><div class="filters">${fl(fT,'ft',['all','sell','buy'],{all:'all',sell:'forsale',buy:'wanted'})}${fl(fC,'fc',['all','moto','part'],{all:'all',moto:'moto',part:'part'})}<button class="g ${fF?'on':''}" data-ff="1">♥ ${t.fav}</button></div>`+

 }
}

$('main').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const D=b.dataset;
 if(D.j){const s=S.sorties.find(x=>x.id==D.j);s.joined=!s.joined}
 else if(D.ft)fT=D.ft;else if(D.fc)fC=D.fc;

 try{const r=await sbc().from('profiles').select('first_name').eq('id',u.id).maybeSingle();if(r.data&&r.data.first_name)myName=r.data.first_name}catch(e){}

function parseGpx(txt,fname){
 const x=new DOMParser().parseFromString(txt,'application/xml');
 if(x.getElementsByTagName('parsererror').length)throw new Error(W('Fichier GPX illisible.','ملف GPX غير مقروء.','Unreadable GPX file.'));

 const ok=p=>isFinite(p[0])&&isFinite(p[1])&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180;
 let nodes=all('trkpt');if(nodes.length<2)nodes=all('rtept');

 let km=0,up=0,dn=0,ref=null,amin=Infinity,amax=-Infinity;const cum=[0];

 P.forEach(p=>{const e=p[2];if(e==null||!isFinite(e))return;if(e<amin)amin=e;if(e>amax)amax=e;if(ref==null){ref=e;return}if(e-ref>=5){up+=e-ref;ref=e}else if(ref-e>=5){dn+=ref-e;ref=e}});
 const step=km/400,K=[];let last=-Infinity;
 P.forEach((p,i)=>{if(cum[i]-last>=step||i==P.length-1){K.push([+p[0].toFixed(5),+p[1].toFixed(5),p[2]==null||!isFinite(p[2])?null:Math.round(p[2]),Math.round(cum[i])]);last=cum[i]}});
 const nm=(x.getElementsByTagNameNS('*','metadata')[0]&&kid(x.getElementsByTagNameNS('*','metadata')[0],'name'))||(all('trk')[0]&&kid(all('trk')[0],'name'))||(all('rte')[0]&&kid(all('rte')[0],'name'))||String(fname||'Roadbook').replace(/\.gpx$/i,'');
 const wp=nodes===wn?[]:wn.slice(0,20).map(n=>{const p=pt(n);return ok(p)?{n:kid(n,'name').slice(0,60),la:+p[0].toFixed(5),lo:+p[1].toFixed(5)}:null}).filter(Boolean);

function traceSvg(r){

 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const Wd=320,Ht=200,pad=14,s=Math.min((Wd-2*pad)/((x1-x0)||1e-9),(Ht-2*pad)/((y1-y0)||1e-9));
 const ox=(Wd-(x1-x0)*s)/2,oy=(Ht-(y1-y0)*s)/2,X=v=>(ox+(v-x0)*s).toFixed(1),Y=v=>(oy+(v-y0)*s).toFixed(1);
 const pl=p.map((q,i)=>X(xs[i])+','+Y(ys[i])).join(' ');
 const wp=(r.wp||[]).map(w=>`<circle cx="${X(w.lo*k)}" cy="${Y(-w.la)}" r="3.5" fill="var(--ink)" stroke="var(--card)" stroke-width="1.5"><title>${E(w.n)}</title></circle>`).join('');
 const n=p.length-1;
 return `<svg class="mp-svg" viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${E(r.name)}"><polyline points="${pl}" fill="none" stroke="var(--ink)" stroke-opacity=".35" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${pl}" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>${wp}<circle cx="${X(xs[n])}" cy="${Y(ys[n])}" r="7" fill="#d7263d" stroke="#fff" stroke-width="2"/><circle cx="${X(xs[0])}" cy="${Y(ys[0])}" r="7" fill="#0f9d6b" stroke="#fff" stroke-width="2"/></svg>`;
}
function profSvg(r){
 const p=r.pts.filter(q=>q[2]!=null);if(p.length<2||r.amax==null||r.amax-r.amin<2)return'';
 const Wd=320,Ht=70,tot=r.pts[r.pts.length-1][3]||1,lo=r.amin,hi=r.amax;

function radar(){

<script>
(function(){
const W=(f,a,e)=>lang=='ar'?a:lang=='en'?e:f;
const sbc=()=>window.mrSb||null,me=()=>(window.mrUser&&window.mrUser())||null;
const main=document.getElementById('main');
const notReady=()=>W('Le serveur n’est pas encore prêt pour cette fonction : exécute le dernier script SQL dans Supabase (SQL Editor).','الخادم غير جاهز بعد لهذه الميزة: نفّذ آخر سكربت SQL في Supabase.','The server is not ready for this feature yet: run the latest SQL script in Supabase (SQL Editor).');
const fail=e=>{const m=String((e&&e.message)||e||'');alert(/Could not find the function|PGRST202|schema cache/i.test(m+((e&&e.code)||''))?notReady():m||W('Erreur réseau.','خطأ في الشبكة.','Network error.'))};
const gOf=id=>S.groups.find(x=>String(x.id)==String(id));
const canRide=s=>!s.srv||(me()&&(s.creator||(gOf(s.g)&&gOf(s.g).owner)));
const canGroup=g=>!g.srv||(me()&&g.owner);
const btn=(k,v,txt)=>`<div class="mr-delrow"><button class="g mr-danger" data-${k}="${v}">🗑 ${txt}</button></div>`;
function post(){
 if(tab==1){
  main.querySelectorAll('button[data-j]').forEach(b=>{
   const s=S.sorties.find(x=>String(x.id)==b.dataset.j),c=b.closest('.card');
   if(!s||!c||c.querySelector('[data-rdel]')||!canRide(s))return;
   c.insertAdjacentHTML('beforeend',btn('rdel',s.id,W('Supprimer la sortie','حذف الرحلة','Delete ride')));
  });
 }else if(tab==3&&!gid){
  main.querySelectorAll('button[data-mj]').forEach(b=>{
   const g=gOf(b.dataset.mj),c=b.closest('.card');if(!g||!c||c.dataset.mrv)return;c.dataset.mrv=1;
   if(g.pend){b.textContent='⏳ '+W('En attente','قيد الانتظار','Pending');b.classList.add('done')}
   const tags=[];if(g.appr&&!g.me&&!g.pend)tags.push('✋ '+W('Sur validation','بموافقة الرئيس','Approval needed'));
   if(g.reqs&&g.reqs.length)tags.push('🔔 '+g.reqs.length+' '+W('demande(s)','طلب(ات)','request(s)'));
   if(tags.length)c.querySelector('h3').insertAdjacentHTML('afterend','<div>'+tags.map(x=>'<span class="tag">'+x+'</span>').join(' ')+'</div>');
  });
 }
 if(tab==3&&gid){
  const g0=gOf(gid);
  if(g0&&g0.reqs&&g0.reqs.length&&!main.querySelector('[data-gok]')){
   const h=g0.reqs.map(r=>`<div class="row" style="align-items:center"><b>${String(r.name).replace(/[&<>"]/g,'')}</b><span><button class="g" data-gno="${r.uid}">✕ ${W('Refuser','رفض','Decline')}</button> <button class="p" data-gok="${r.uid}">✓ ${W('Accepter','قبول','Accept')}</button></span></div>`).join('');
   const back=main.querySelector('.filters');(back||main).insertAdjacentHTML(back?'afterend':'afterbegin',`<div class="card"><h3>🔔 ${W('Demandes pour rejoindre','طلبات الانضمام','Join requests')}</h3>${h}</div>`);
  }
  const g=gOf(gid);
  if(g&&canGroup(g)&&!main.querySelector('[data-gdel]'))main.insertAdjacentHTML('beforeend',`<div class="card">${btn('gdel',g.id,W('Supprimer le groupe','حذف المجموعة','Delete group'))}</div>`);
 }
}
const _r=render;render=function(){const r=_r.apply(this,arguments);try{post()}catch(e){console.error('del',e)}return r};
main.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 const D=b.dataset;
 if(D.past!==undefined){e.stopImmediatePropagation();window.mrShowPast=!window.mrShowPast;render();window.scrollTo(0,0);return}
 if(D.rdel!==undefined){
  e.stopImmediatePropagation();
  const s=S.sorties.find(x=>String(x.id)==D.rdel);if(!s)return;
  if(!confirm(W('Supprimer la sortie « '+s.t+' » ?'+(s.srv?'\nElle disparaîtra pour tous les participants.':''),'هل تريد حذف الرحلة «'+s.t+'»؟'+(s.srv?'\nستختفي عند جميع المشاركين.':''),'Delete the ride “'+s.t+'”?'+(s.srv?'\nIt will disappear for all participants.':''))))return;
  if(s.srv){b.disabled=true;const r=await sbc().rpc('delete_ride',{p_ride:String(s.uid)});b.disabled=false;if(r.error){fail(r.error);return}S.sorties=S.sorties.filter(x=>x!==s);save();render();if(window.mrSync)await window.mrSync();return}
  S.sorties=S.sorties.filter(x=>x!==s);save();render();return;
 }
 if(D.gok!==undefined||D.gno!==undefined){
  e.stopImmediatePropagation();
  const g=gOf(gid);if(!g||!g.srv)return;b.disabled=true;
  const r=await sbc().rpc('decide_member',{p_group:g.uid,p_user:D.gok!==undefined?D.gok:D.gno,p_accept:D.gok!==undefined});
  b.disabled=false;if(r.error){fail(r.error);return}
  if(window.mrSync)await window.mrSync();return;
 }
 if(D.gdel!==undefined){
  e.stopImmediatePropagation();
  const g=gOf(D.gdel);if(!g)return;
  if(!confirm(W('Supprimer le groupe « '+g.name+' » ?\nSes sorties'+(g.srv?', ses membres et sa discussion':' et ses souvenirs')+' seront aussi supprimés. C’est irréversible.','هل تريد حذف المجموعة «'+g.name+'»؟\nستُحذف أيضًا رحلاتها'+(g.srv?' وأعضاؤها ومحادثتها':' وذكرياتها')+'. لا يمكن التراجع.','Delete the group “'+g.name+'”?\nIts rides'+(g.srv?', members and chat':' and memories')+' will also be deleted. This cannot be undone.')))return;
  if(g.srv){b.disabled=true;const r=await sbc().rpc('delete_group',{p_group:String(g.uid)});b.disabled=false;if(r.error){fail(r.error);return}}
  else S.mems=S.mems.filter(m=>String(m.g)!=String(g.id));
  S.sorties=S.sorties.filter(x=>String(x.g)!=String(g.id));S.groups=S.groups.filter(x=>x!==g);gid=null;save();render();
  if(g.srv&&window.mrSync)await window.mrSync();
  return;
 }
},true);
render();
})();
</script>

    {fr:'Kabyle', ar:'قبائلي', en:'Kabyle', q:'tag=kabyle'},
    {fr:'Rock', ar:'روك', en:'Rock', q:'tag=rock'},
    {fr:'Monde', ar:'العالم', en:'World', q:''}
  ];
  // Morceaux à la demande : catalogue libre Audius (écoute gratuite, sans compte pour les membres).
  const AUDIUS = 'https://api.audius.co/v1', AU_APP = 'MotoRoute', AU_KEY = ''; // clé développeur gratuite à coller ici si Audius l'exige
  const auQ = () => 'app_name=' + AU_APP + (AU_KEY ? '&api_key=' + encodeURIComponent(AU_KEY) : '');
  let tracks = null, tMsg = '', tLoading = false, tq = '', tchip = 0;
  const TCHIPS = [
    {fr:'Tendances', ar:'الرائج', en:'Trending', p:'/tracks/trending?time=week&limit=40'},
    {fr:'Raï', ar:'الراي', en:'Raï', p:'/tracks/search?query=rai&limit=40'},
    {fr:'Chaabi', ar:'الشعبي', en:'Chaabi', p:'/tracks/search?query=chaabi&limit=40'},
    {fr:'Rap', ar:'راب', en:'Rap', p:'/tracks/trending?genre=Hip-Hop%2FRap&time=week&limit=40'},
    {fr:'Électro', ar:'إلكترو', en:'Electro', p:'/tracks/trending?genre=Electronic&time=week&limit=40'},
    {fr:'Rock', ar:'روك', en:'Rock', p:'/tracks/trending?genre=Rock&time=week&limit=40'}
  ];
  const mmss = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  async function loadTracks(path, label){
    tLoading = true; tMsg = W3('Recherche des morceaux…','جارٍ البحث عن الأغاني…','Searching tracks…'); rerender();
    try {
      const r = await fetch(AUDIUS + path + (path.includes('?') ? '&' : '?') + auQ());
      if (!r.ok) throw r.status;
      const j = await r.json();
      tracks = (j.data || []).filter(x => x && x.id && x.is_streamable !== false && !x.is_stream_gated)
        .map(x => ({name:x.title || 'Morceau', url:AUDIUS + '/tracks/' + encodeURIComponent(x.id) + '/stream?' + auQ(), info:((x.user && x.user.name) || '') + (x.duration ? ' · ' + mmss(x.duration) : ''), live:false}));
      tMsg = tracks.length ? '' : W3('Aucun morceau trouvé pour « ' + label + ' ».','لم يتم العثور على أغانٍ لـ « ' + label + ' ».','No track found for “' + label + '”.');
    } catch(e) {
      tracks = []; tMsg = (e === 401 || e === 403) ? W3('Audius demande une clé : il faut l’ajouter dans l’app.','يطلب Audius مفتاحًا: يجب إضافته في التطبيق.','Audius requires a key: it must be added to the app.')
        : W3('Pas de connexion au catalogue de musique. Vérifie Internet et réessaie.','تعذّر الاتصال بكتالوج الموسيقى. تحقّق من الإنترنت.','Could not reach the music catalog. Check your connection.');
    }
    tLoading = false; rerender();
  }
  const API = ['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://de2.api.radio-browser.info'];
  async function api(path){
    let last;
    for (const h of API) { try { const r = await fetch(h + path); if (r.ok) return await r.json(); last = r.status; } catch(e) { last = e; } }
    throw last;
  }
  async function loadRadios(qs, label){
    rLoading = true; rMsg = W3('Recherche des radios…','جارٍ البحث عن الإذاعات…','Searching radios…'); rerender();
    try {
      const L = await api('/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=80' + (qs ? '&' + qs : ''));
      radios = L.filter(s => s.url_resolved && s.url_resolved.startsWith('https://')).slice(0, 40)
        .map(s => ({name:(s.name||'').trim() || 'Radio', url:s.url_resolved, info:[s.country, (s.tags||'').split(',').slice(0,2).join(', '), s.bitrate ? s.bitrate + ' kb/s' : ''].filter(Boolean).join(' · '), live:true}));
      rMsg = radios.length ? '' : W3('Aucune radio trouvée pour « ' + label + ' ».','لم يتم العثور على إذاعة لـ « ' + label + ' ».','No radio found for “' + label + '”.');
    } catch(e) {
      radios = []; rMsg = W3('Pas de connexion à l’annuaire des radios. Vérifie Internet et réessaie.','تعذّر الاتصال بدليل الإذاعات. تحقّق من الإنترنت وأعد المحاولة.','Could not reach the radio directory. Check your connection.');
    }
    rLoading = false; rerender();
  }
  // ---------- Lecture ----------
  function setMS(t){
    try {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({title:t.name, artist:'MotoRoute', album:t.info || W3('Musique','الموسيقى','Music')});
      navigator.mediaSession.setActionHandler('play', () => play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
      navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
    } catch(e) {}
  }
  function start(list, i){
    queue = list.slice(); qi = i; const t = queue[qi]; if (!t) return;
    err = ''; state = 'loading'; audio.src = t.url; setMS(t); play(); bar(); rerender();
  }
  function play(){ if (!audio.src) return; const p = audio.play(); if (p && p.catch) p.catch(() => { state = 'paused'; bar(); rerender(); }); }
  function step(d){ if (!queue.length) return; start(queue, (qi + d + queue.length) % queue.length); }
  function stop(){ audio.pause(); audio.removeAttribute('src'); try { audio.load(); } catch(e) {} queue = []; qi = -1; state = 'idle'; bar(); rerender(); }
  audio.addEventListener('playing', () => { state = 'playing'; err = ''; bar(); rerender(); });
  audio.addEventListener('pause', () => { if (state !== 'idle') { state = 'paused'; bar(); rerender(); } });
  audio.addEventListener('waiting', () => { state = 'loading'; bar(); });
  audio.addEventListener('ended', () => step(1));
  audio.addEventListener('error', () => { if (qi < 0) return; err = W3('Ce flux ne répond pas. Essaie une autre radio.','هذا البث لا يستجيب. جرّب إذاعة أخرى.','This stream is not responding. Try another one.'); state = 'paused'; bar(); rerender(); });
  function bar(){
    const b = document.getElementById('mu_bar'); if (!b) return;
    const t = queue[qi], show = !!t;
    b.hidden = !show; document.body.classList.toggle('mu-on', show);
    try { const nv = document.querySelector('nav'), fixedBottom = nv && getComputedStyle(nv).position === 'fixed';
      document.documentElement.style.setProperty('--mu-nav', (fixedBottom ? nv.offsetHeight : 0) + 'px');
      document.documentElement.style.setProperty('--mu-h', (show ? b.offsetHeight : 0) + 'px'); } catch(e) {}
    if (!t) return;
    document.getElementById('mu_bar_t').textContent = t.name;
    document.getElementById('mu_bar_s').textContent = err || (state === 'loading' ? W3('Connexion…','جارٍ الاتصال…','Connecting…') : [t.live ? W3('Radio en direct','إذاعة مباشرة','Live radio') : '', t.info].filter(Boolean).join(' · '));
    document.getElementById('mu_bar_play').textContent = state === 'playing' || state === 'loading' ? '⏸' : '▶';
  }
  // ---------- Vue (carte de l'onglet Route) ----------
  function row(t, i, list, opt){
    const now = queue[qi] && queue[qi].url === t.url;
    return `<div class="mu-row${now ? ' now' : ''}"><button class="mu-pick" data-mu="play" data-l="${opt.l}" data-i="${i}"><b>${now && state === 'playing' ? '♪ ' : ''}${esc(t.name)}</b><span>${esc(opt.sub ? opt.sub(t) : (t.info || ''))}</span></button>`
      + (opt.star ? `<button class="mu-ic${inDir(t.url) ? ' on' : ''}" data-mu="star" data-i="${i}" aria-label="${W3('Enregistrer','حفظ','Save')}">★</button>` : '')
      + (opt.del ? `<button class="mu-ic" data-mu="del" data-i="${i}" aria-label="${W3('Retirer','إزالة','Remove')}">✕</button>` : '') + `</div>`;
  }
  window.mrMusicHtml = function(){
    if (open && radios === null && !rLoading) { const c = CHIPS[chip]; setTimeout(() => loadRadios(c.q, c[lang] || c.fr), 0); }
    const t = queue[qi];
    let body = '';
    if (view === 'radio') {
      body = `<div class="mu-chips">${CHIPS.map((c, i) => `<button class="g${i === chip && !q ? ' on' : ''}" data-mu="chip" data-i="${i}">${esc(c[lang] || c.fr)}</button>`).join('')}</div>
        <form class="mu-form" data-mu-form="search"><div class="mu-2"><input id="mu_q" type="search" value="${esc(q)}" placeholder="${W3('Nom d’une radio','اسم إذاعة','Radio name')}"><button class="p" type="submit">${W3('Chercher','بحث','Search')}</button></div></form>
        ${rMsg ? `<div class="meta" style="margin:8px 0">${esc(rMsg)}</div>` : ''}
        <div class="mu-list">${(radios || []).map((r, i) => row(r, i, radios, {l:'radio', star:true})).join('')}</div>`;
    } else if (view === 'songs') {
      if (tracks === null && !tLoading) { const c = TCHIPS[tchip]; setTimeout(() => loadTracks(c.p, c[lang] || c.fr), 0); }
      body = `<div class="mu-chips">${TCHIPS.map((c, i) => `<button class="g${i === tchip && !tq ? ' on' : ''}" data-mu="tchip" data-i="${i}">${esc(c[lang] || c.fr)}</button>`).join('')}</div>
        <form class="mu-form" data-mu-form="tsearch"><div class="mu-2"><input id="mu_tq" type="search" value="${esc(tq)}" placeholder="${W3('Titre, artiste, style…','عنوان، فنان، نوع…','Title, artist, genre…')}"><button class="p" type="submit">${W3('Chercher','بحث','Search')}</button></div></form>
        ${tMsg ? `<div class="meta" style="margin:8px 0">${esc(tMsg)}</div>` : ''}
        <div class="mu-list">${(tracks || []).map((r, i) => row(r, i, tracks, {l:'songs', star:true})).join('')}</div>
        <div class="meta" style="font-size:11px;margin-top:6px">${W3('Musique libre d’artistes indépendants, via Audius.','موسيقى حرّة لفنانين مستقلين عبر Audius.','Free music from independent artists, via Audius.')}</div>`;
    } else if (view === 'dir') {
      body = dir.length ? `<div class="mu-list">${dir.map((r, i) => row(r, i, dir, {l:'dir', del:true, sub:x => (x.cat ? x.cat + ' · ' : '') + x.url})).join('')}</div>`
        : `<div class="meta" style="margin:10px 0">${W3('Ton annuaire est vide. Touche ★ sur une radio, ou ajoute une adresse dans « Lien ».','دليلك فارغ. المس ★ على إذاعة، أو أضف عنوانًا في « رابط ».','Your list is empty. Tap ★ on a radio, or add an address under “Link”.')}</div>`;
    } else {
      body = `<form class="mu-form" data-mu-form="link">
        <input id="mu_url" type="url" inputmode="url" placeholder="https://…/morceau.mp3 ${W3('ou flux radio','أو بث إذاعي','or radio stream')}">
        <div class="mu-2"><input id="mu_name" placeholder="${W3('Nom (facultatif)','الاسم (اختياري)','Name (optional)')}"><select id="mu_cat"><option>Radio</option><option>${W3('Musique','موسيقى','Music')}</option><option>Podcast</option></select></div>
        <div class="mu-2"><button class="p" type="submit" data-act="save" style="flex:1">${W3('Enregistrer','حفظ','Save')}</button><button class="g" type="submit" data-act="play" style="flex:1">${W3('Lire','تشغيل','Play')}</button></div>
        </form>${err && view === 'link' ? '' : ''}<div class="meta" id="mu_lmsg" style="margin-top:6px"></div>`;
    }
    const ext = [['YouTube Music','https://music.youtube.com'],['Spotify','https://open.spotify.com'],['Deezer','https://www.deezer.com']];
    const playing = state === 'playing' || state === 'loading';
    const head = `<div class="mu-head"><h3>🎵 ${W3('Musique','الموسيقى','Music')}${t ? `<span class="mu-now">${playing ? '♪ ' : ''}${esc(t.name)}${err ? ' · ' + esc(err) : ''}</span>` : `<span class="mu-now">${W3('Radios gratuites, sans compte','إذاعات مجانية بدون حساب','Free radios, no account')}</span>`}</h3>`
      + (t ? `<button class="g" data-mu="prev" aria-label="prev">⏮</button><button class="p" data-mu="toggle" aria-label="play">${playing ? '⏸' : '▶'}</button><button class="g" data-mu="next" aria-label="next">⏭</button>` : '')
      + `<button class="mu-fold" data-mu="fold" aria-label="${open ? W3('Réduire','تصغير','Collapse') : W3('Ouvrir','فتح','Open')}">${open ? '▴' : '▾'}</button></div>`;
    if (!open) return `<div class="card" style="padding:10px 12px">${head}</div>`;
    return `<div class="card" style="padding:10px 12px">${head}
      <div class="mu-tabs"><button class="g${view === 'radio' ? ' on' : ''}" data-mu="view" data-v="radio">${W3('Radios','إذاعات','Radios')}</button><button class="g${view === 'songs' ? ' on' : ''}" data-mu="view" data-v="songs">${W3('Morceaux','أغانٍ','Tracks')}</button><button class="g${view === 'dir' ? ' on' : ''}" data-mu="view" data-v="dir">${W3('Mon annuaire','دليلي','My list')} (${dir.length})</button><button class="g${view === 'link' ? ' on' : ''}" data-mu="view" data-v="link">${W3('Lien','رابط','Link')}</button></div>
      ${body}
      <div class="meta" style="margin-top:10px;font-size:12px">${W3('Ou ouvre ton appli :','أو افتح تطبيقك:','Or open your app:')} ${ext.map(m => `<a target="_blank" rel="noopener" href="${m[1]}">${m[0]}</a>`).join(' · ')}</div></div>`;
  };
  // ---------- Actions ----------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-mu]'); if (!b) return;
    const a = b.dataset.mu, i = +b.dataset.i;
    if (a === 'toggle') { if (audio.paused) play(); else audio.pause(); }
    else if (a === 'next') step(1);
    else if (a === 'prev') step(-1);
    else if (a === 'stop') stop();
    else if (a === 'view') { view = b.dataset.v; rerender(); }
    else if (a === 'fold') { open = !open; rerender(); }
    else if (a === 'chip') { chip = i; q = ''; const c = CHIPS[i]; loadRadios(c.q, c[lang] || c.fr); }
    else if (a === 'play') { const L = b.dataset.l === 'dir' ? dir.map(x => ({...x, live:x.live !== undefined ? x.live : !/\.(mp3|m4a|aac|ogg|oga|wav|flac|opus)(\?|$)|\/stream\?/i.test(x.url)})) : b.dataset.l === 'songs' ? tracks : radios; start(L, i); }
    else if (a === 'star') { const src = b.closest('.mu-row').querySelector('[data-l]').dataset.l === 'songs' ? tracks : radios, r = src[i]; if (inDir(r.url)) dir = dir.filter(x => x.url !== r.url); else dir.unshift({name:r.name, url:r.url, cat:src === tracks ? W3('Musique','موسيقى','Music') : 'Radio', info:r.info, live:r.live}); saveDir(); rerender(); }
    else if (a === 'tchip') { tchip = i; tq = ''; const c = TCHIPS[i]; loadTracks(c.p, c[lang] || c.fr); }
    else if (a === 'del') { dir.splice(i, 1); saveDir(); rerender(); }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-mu-form]'); if (!f) return;
    e.preventDefault();
    if (f.dataset.muForm === 'tsearch') { tq = (document.getElementById('mu_tq').value || '').trim(); if (tq) loadTracks('/tracks/search?limit=40&query=' + encodeURIComponent(tq), tq); return; }
    if (f.dataset.muForm === 'search') { q = (document.getElementById('mu_q').value || '').trim(); if (q) loadRadios('name=' + encodeURIComponent(q), q); return; }
    const u = (document.getElementById('mu_url').value || '').trim(), msg = document.getElementById('mu_lmsg');
    if (!/^https:\/\//i.test(u)) { msg.textContent = W3('Colle une adresse qui commence par https://','الصق عنوانًا يبدأ بـ https://','Paste an address starting with https://'); return; }
    let name = (document.getElementById('mu_name').value || '').trim();
    if (!name) { try { name = decodeURIComponent(u.split('/').pop().split('?')[0]).replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '); } catch(err) {} }
    name = name || new URL(u).hostname;
    const item = {name, url:u, cat:document.getElementById('mu_cat').value, info:''};
    const act = (e.submitter && e.submitter.dataset.act) || 'save';
    if (act === 'play') { start([{...item, live:!/\.(mp3|m4a|aac|ogg|oga|wav|flac|opus)(\?|$)/i.test(u)}], 0); return; }
    if (!inDir(u)) { dir.unshift(item); saveDir(); }
    view = 'dir'; rerender();
  });
})();
</script>
<script>
/* Présentation animée au premier lancement (www/presentation.html), revoir depuis l'aide « ? » */
(function(){
  const KEY = 'mr_onb_seen';
  const L = () => (typeof lang !== 'undefined' ? lang : 'fr');
  function open(){
    if (document.getElementById('mr_onb')) return;
    const f = document.createElement('iframe');
    f.id = 'mr_onb'; f.src = 'presentation.html?app=1&lang=' + L(); f.setAttribute('allow', 'autoplay; fullscreen');
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99999;background:#06080c';
    document.body.appendChild(f);
    // l'aide « Comment ça marche ? » s'ouvre au premier lancement : la présentation la remplace
    const shut = () => document.querySelectorAll('dialog[open]').forEach(d => { if (document.getElementById('mr_onb')) try { d.close(); } catch(e) {} });
    shut(); [300, 700, 1200].forEach(t => setTimeout(shut, t));
  }
  function close(signup){
    try { localStorage.setItem(KEY, '1'); } catch(e) {}
    const f = document.getElementById('mr_onb'); if (f) f.remove();
    if (signup) { const b = document.getElementById('acct'); if (b && b.textContent.trim() === '🔑') setTimeout(() => b.click(), 250); }
  }
  window.addEventListener('message', e => { const d = e.data || {}; if (d.type === 'motoroute-onboarding-done') close(!!d.signup); });
  window.mrOpenOnboarding = open;
  // bouton « Revoir la présentation » en haut de l'aide
  const d5 = document.getElementById('d5');
  if (d5) {
    const b = document.createElement('button'); b.className = 'p'; b.type = 'button'; b.id = 'mr_onb_btn';
    b.style.cssText = 'width:100%;margin:4px 0 12px';
    const lab = () => { b.textContent = L() === 'ar' ? '▶ مشاهدة العرض التقديمي' : L() === 'en' ? '▶ Watch the presentation' : '▶ Revoir la présentation'; };
    lab(); b.onclick = () => { try { d5.close(); } catch(e) {} open(); };
    d5.insertBefore(b, d5.children[1] || null);
    const h = document.getElementById('help'); if (h) h.addEventListener('click', lab);
  }
  try { if (!localStorage.getItem(KEY)) setTimeout(open, 400); } catch(e) {}
})();
</script>
